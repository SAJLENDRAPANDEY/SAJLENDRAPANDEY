name: Update GitHub Activity Overview

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate GitHub Activity Overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: SAJLENDRAPANDEY
        run: |
          mkdir -p assets scripts
          python scripts/generate_github_activity.py

      - name: Commit updated activity card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-overview.svg
          if git diff --cached --quiet; then
            echo "No activity changes."
          else
            git commit -m "chore: update GitHub activity overview"
            git push
          fi
